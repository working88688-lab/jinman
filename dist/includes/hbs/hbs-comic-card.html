
<template id="comic-item-template" type="text/x-handlebars-template">{{#each items}}
  <li><a href="comic_detail.html?id=1">
      <div class="flex aspect-w-11 group aspect-h-16 overflow-hidden">
        <div class="poster rounded-sm overflow-hidden pointer-events-auto"><img class="w-full h-full rounded-sm group-hover:scale-125 transition-all" src="/static/frontend/images/loading.svg" data-src="{{target.front_end_thumb}}" alt="{{target.title}}"/>
          <div class="w-full px-0.5 py-1 md:p-2 absolute left-0 top-0 flex group-hover:hidden">
            <div class="text-sm py-0.5 px-2 dx-bg-linear text-white rounded-large ">{{target.status}}</div>
          </div>
        </div>
      </div>
      <div class="block mt-0.5 text-sm">
        <div class="truncate text-default text-base2">{{target.title}}</div>
        <div class="flex justify-between text-base3 my-0.5"><span>{{target.author}}</span><span>剧情</span></div>
        <div class="flex items-center text-base3"><span class="mr-auto">{{target.updated_at}}</span>
          <div class="flex items-center mr-1">
            <svg class="w-3 h-3 md:w-4 md:h-4 mr-0.5">
              <use href="/static/frontend/icons/icons.svg#view"></use>
            </svg><span>{{target.view_num_str}}</span>
          </div>
          <div class="flex items-center">
            <svg class="w-3 h-3 md:w-4 md:h-4 mr-0.5">
              <use href="/static/frontend/icons/icons.svg#like"></use>
            </svg><span>{{target.collect_num}}</span>
          </div>
        </div>
      </div></a></li>{{/each}}
</template>
